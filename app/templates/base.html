<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#C23A2B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="日语会话">
  <title>{% block title %}日语会话 Hanashi{% endblock %}</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/static/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <p class="brand">日语会话 <span>Hanashi</span></p>
      {% block header %}{% endblock %}
    </header>
    <main class="main {% block main_class %}{% endblock %}">
      {% block content %}{% endblock %}
    </main>
    <nav class="tabbar" aria-label="主导航">
      <a class="tab {% if active == 'home' %}is-on{% endif %}" href="/">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg>
        首页
      </a>
      <a class="tab {% if active == 'conversation' %}is-on{% endif %}" href="/conversation">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H9l-4 4v-4H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/></svg>
        会话
      </a>
      <a class="tab {% if active == 'dictionary' %}is-on{% endif %}" href="/dictionary">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h9a3 3 0 0 1 3 3v13H8a2 2 0 0 0-2 2V4zm2 3v10h10V7H8z"/></svg>
        查词
      </a>
      <a class="tab {% if active == 'shadowing' %}is-on{% endif %}" href="/shadowing">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l10 6-10 6zm-4-2V8H3v8h2z"/></svg>
        跟读
      </a>
      <a class="tab {% if active == 'dictation' %}is-on{% endif %}" href="/dictation">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v2H4V5zm0 6h10v2H4v-2zm0 6h16v2H4v-2z"/></svg>
        听写
      </a>
    </nav>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script src="/static/js/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
